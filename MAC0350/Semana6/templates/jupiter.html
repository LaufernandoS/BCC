<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeuJupiterWeb</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --primary: #00B3B3;
            --primary-dark: #008080;
            --primary-light: #55FFFF;
            --accent: #FF4400;
            --bg: #55FFFF;
            --card-bg: #10B3B3;
            --text-dark: #1a2e2e;
            --text-muted: #2a5050;
            --radius: 10px;
            --shadow: 0 4px 18px rgba(0,0,0,0.13);
        }

        body {
            background-color: var(--bg);
            font-family: "Verdana", Arial, sans-serif;
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ── HEADER ── */
        header {
            background: #fff;
            border-bottom: 3px solid var(--primary);
            padding: 12px 0;
        }

        .header-inner {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0 20px;
        }

        .header-inner img {
            height: 64px;
            width: auto;
            display: block;
        }

        /* ── MAIN CONTENT ── */
        .main-wrapper {
            flex: 1;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
            padding: 32px 20px 24px;
        }

        .page-title {
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 6px;
            color: var(--text-dark);
        }

        .page-subtitle {
            font-size: 15px;
            color: var(--text-muted);
            margin-bottom: 28px;
        }

        /* ── GRID ── */
        .content-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 28px;
            align-items: start;
        }

        @media (max-width: 640px) {
            .content-grid { grid-template-columns: 1fr; }
        }

        /* ── MENU BOXES ── */
        .nav-section { display: flex; flex-direction: column; gap: 20px; }

        .menu-box {
            background-color: var(--card-bg);
            padding: 20px 22px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            transition: box-shadow 0.2s;
        }

        .menu-box:hover { box-shadow: 0 6px 24px rgba(0,0,0,0.18); }

        .menu-box h2 {
            font-size: 15px;
            font-weight: bold;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: #fff;
            margin-bottom: 14px;
            padding-bottom: 8px;
            border-bottom: 2px solid rgba(255,255,255,0.3);
        }

        /* Menu buttons */
        .menu-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 6px;
            color: #fff;
            font-family: "Verdana", Arial, sans-serif;
            font-size: 13.5px;
            padding: 8px 12px;
            margin-bottom: 7px;
            cursor: pointer;
            text-align: left;
            transition: background 0.18s, transform 0.12s, border-color 0.18s;
            text-decoration: none;
        }

        .menu-btn:last-child { margin-bottom: 0; }

        .menu-btn:hover {
            background: rgba(255,255,255,0.28);
            border-color: rgba(255,255,255,0.5);
            transform: translateX(3px);
        }

        .menu-btn:active { transform: translateX(1px) scale(0.98); }

        .menu-btn .icon {
            font-size: 14px;
            opacity: 0.85;
            flex-shrink: 0;
        }

        /* ── LOGIN BOX ── */
        .login-card {
            background: var(--card-bg);
            padding: 26px 22px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        .login-card h3 {
            color: #fff;
            font-size: 15px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 18px;
            text-align: center;
        }

        .login-card input {
            display: block;
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 12px;
            border: 1.5px solid rgba(255,255,255,0.3);
            border-radius: 6px;
            background: rgba(255,255,255,0.18);
            color: #fff;
            font-family: "Verdana", Arial, sans-serif;
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s, background 0.2s;
        }

        .login-card input::placeholder { color: rgba(255,255,255,0.6); }
        .login-card input:focus {
            border-color: rgba(255,255,255,0.7);
            background: rgba(255,255,255,0.28);
        }

        .login-card .btn-login {
            width: 100%;
            padding: 10px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 6px;
            font-family: "Verdana", Arial, sans-serif;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.18s, transform 0.12s;
            margin-top: 4px;
        }

        .login-card .btn-login:hover { background: #cc3300; }
        .login-card .btn-login:active { transform: scale(0.97); }

        /* Toast notification */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--primary-dark);
            color: #fff;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 13px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
            opacity: 0;
            transform: translateY(12px);
            transition: opacity 0.3s, transform 0.3s;
            pointer-events: none;
            z-index: 999;
        }
        .toast.show { opacity: 1; transform: translateY(0); }

        /* ── FOOTER ── */
        footer {
            text-align: center;
            padding: 16px;
            font-size: 12px;
            color: var(--accent);
            border-top: 2px solid var(--primary);
            background: rgba(0,0,0,0.04);
        }

        footer a {
            color: var(--accent);
            margin: 0 6px;
            text-decoration: underline;
        }

        footer a:hover { color: #cc3300; }
    </style>
</head>
<body>

    <header>
        <div class="header-inner">
            <img src="logo-usp-universidade-de-sao-paulo.png"
                 alt="Logo USP - Universidade de São Paulo" />
        </div>
    </header>

    <div class="main-wrapper">
        <h1 class="page-title">Bem-vindo ao JupiterWeb!</h1>
        <p class="page-subtitle">Autentique-se para acessar o conteúdo do JupiterWeb.</p>

        <div class="content-grid">

            <!-- Menus de navegação -->
            <nav class="nav-section">

                <div class="menu-box">
                    <h2>Público</h2>
                    <button class="menu-btn" onclick="menuClick('Calendário Escolar')">
                        <span class="icon">📅</span> Calendário Escolar
                    </button>
                    <button class="menu-btn" onclick="menuClick('Cursos de Ingresso')">
                        <span class="icon">🎓</span> Cursos de Ingresso
                    </button>
                    <button class="menu-btn" onclick="menuClick('Disciplinas')">
                        <span class="icon">📚</span> Disciplinas
                    </button>
                    <button class="menu-btn" onclick="menuClick('Editais')">
                        <span class="icon">📄</span> Editais
                    </button>
                    <button class="menu-btn" onclick="menuClick('FAQ')">
                        <span class="icon">❓</span> FAQ
                    </button>
                </div>

                <div class="menu-box">
                    <h2>Acesso Restrito</h2>
                    <button class="menu-btn" onclick="menuClick('Entrar')">
                        <span class="icon">🔑</span> Entrar
                    </button>
                    <button class="menu-btn" onclick="menuClick('Esqueci a Senha')">
                        <span class="icon">🔒</span> Esqueci a Senha
                    </button>
                    <button class="menu-btn" onclick="menuClick('Primeiro Acesso')">
                        <span class="icon">✨</span> Primeiro Acesso
                    </button>
                </div>

            </nav>

            <!-- Login -->
            <form onsubmit="handleLogin(event)">
                <div class="login-card">
                    <h3>Login</h3>
                    <input type="text" placeholder="Número USP" name="usuario" autocomplete="username" />
                    <input type="password" placeholder="Senha" name="senha" autocomplete="current-password" />
                    <button type="submit" class="btn-login">Entrar</button>
                </div>
            </form>

        </div>
    </div>

    <footer>
        <a href="https://uspdigital.usp.br/jupiterweb/creditos.jsp">Créditos</a>
        <a href="https://uspdigital.usp.br/jupiterweb/jupColegiadoEmailLista">Fale Conosco</a>
        <br>© 1999 – 2026 · Superintendência de Tecnologia da Informação / USP
    </footer>

    <div class="toast" id="toast"></div>

    <script src="jupiter.js"></script>
</body>
</html>
